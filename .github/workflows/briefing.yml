# 備案排程：如果你不想用 Render（或想省錢），GitHub Actions 也能跑同一支程式。
#
# 差別：GitHub Actions 的 cron 不保證準時，可能延遲幾分鐘到十幾分鐘。
# 因為我們的視窗很寬（台灣 05:00–15:45 每 15 分鐘），而且有去重機制，
# 延遲不會漏發，只是簡報可能晚一點到。要準時就用 Render。
#
# 用法：
#   1. 把這個 repo 推到 GitHub（private 就好）
#   2. Settings → Secrets and variables → Actions → 新增下面每一個 secret
#   3. Actions 分頁把這個 workflow 啟用
#
# 注意：這個 workflow 不會把任何 secret 印出來。

name: WHOOP 早晨簡報

on:
  schedule:
    - cron: "*/15 21-23,0-7 * * *" # UTC ≈ 台灣 05:00–15:45
  workflow_dispatch: # 也可以手動按一下立刻跑

concurrency:
  # 保證同一時間只有一個 run（避免兩個 run 同時 refresh token）
  group: whoop-briefing
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm start
        env:
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-5
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TIMEZONE: Asia/Taipei
