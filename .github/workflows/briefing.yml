# 備援排程：Cloudflare Cron 是每 10 分鐘主觸發；GitHub Actions 每小時獨立補位。
#
# GitHub Actions 的 cron 不保證準時，事故中曾漏掉多個時段，因此它不是主排程。
# 去重仍由 Turso report_claims 的 health_date 鍵負責；與 Cloudflare 重疊也只會送一次。
#
# 用法：
#   1. 把這個 repo 推到 GitHub（private 就好）
#   2. Settings → Secrets and variables → Actions → 新增下面每一個 secret
#   3. Actions 分頁把這個 workflow 啟用
#
# 注意：這個 workflow 不會把任何 secret 印出來。

name: WHOOP 早晨簡報

on:
  schedule:
    - cron: "17 * * * *" # 每小時第 17 分：Cloudflare 10 分鐘主排程的獨立備援
  workflow_dispatch: # 也可以手動按一下立刻跑

concurrency:
  # 保證同一時間只有一個 run（避免兩個 run 同時 refresh token）
  group: whoop-briefing
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # 給「60 天無 commit 會被停用排程」的提醒用。checkout 預設 depth=1，
      # 拿最後一次 commit 的時間就夠了。
      - name: 讀取最後一次 commit 時間
        id: repo
        run: echo "last_commit_at=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm start
        env:
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: anthropic/claude-sonnet-5
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TIMEZONE: Asia/Taipei
          REPO_LAST_COMMIT_AT: ${{ steps.repo.outputs.last_commit_at }}
