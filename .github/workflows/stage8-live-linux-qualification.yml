name: Stage8 isolated Linux HTTP qualification

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Reviewed, published 40-character commit in this repository
        required: true
        type: string
      mode:
        description: Full qualification or one empty-user one-call diagnostic (never qualification)
        required: true
        default: qualification
        type: choice
        options:
          - qualification
          - diagnostic-empty-one
          - native-empty-restart
          - native-empty-attribution
          - native-empty-metadata-repair
          - native-empty-principal-snapshot-repair
          - native-finalization-six-empty
          - native-eof-hrana
          - native-positive-eof-hrana
          - native-positive-hybrid-eof
          - native-first20-diagnostic
          - native-first20-appcause
      diagnostic_run_intent:
        description: Only for native-empty-attribution; explicit one-original-empty-120s-v1
        required: false
        default: ""
        type: string

      metadata_repair_run_intent:
        description: Only for native-empty-metadata-repair; one-original-empty-120s-metadata-repair-v1
        required: false
        default: ""
        type: string

      principal_snapshot_repair_run_intent:
        description: Only for native-empty-principal-snapshot-repair; one-original-empty-120s-principal-snapshot-repair-v1
        required: false
        default: ""
        type: string

      finalization_regression_intent:
        description: Only native-finalization-six-empty; one-six-empty-and-modeled-eof-v1
        required: false
        default: ""
        type: string

      hrana_eof_intent:
        description: Only native-eof-hrana; one-original-native-eof-and-exact-replay-v1
        required: false
        default: ""
        type: string

      positive_eof_intent:
        description: Only native-positive-eof-hrana; one-original-positive-eof-and-replay-v1
        required: false
        default: ""
        type: string

      positive_hybrid_eof_intent:
        description: Only native-positive-hybrid-eof; one-original-positive-hybrid-eof-and-replay-v1
        required: false
        default: ""
        type: string

      first20_diagnostic_intent:
        description: Only native-first20-diagnostic; one-original-first20-worker-diagnostic-v1
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: stage8-isolated-linux-qualification
  cancel-in-progress: false

jobs:
  qualify:
    if: github.repository == 'enjoyfulwen0204-eng/whoop-briefing' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode != 'native-empty-restart'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Validate immutable candidate input
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          QUALIFICATION_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$QUALIFICATION_MODE" == qualification || "$QUALIFICATION_MODE" == diagnostic-empty-one ]]
      - name: Checkout reviewed qualification controls
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: enjoyfulwen0204-eng/whoop-briefing
          ref: ${{ github.workflow_sha }}
          path: qualification-control
          persist-credentials: false
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: enjoyfulwen0204-eng/whoop-briefing
          ref: ${{ inputs.candidate_sha }}
          path: candidate-repository
          persist-credentials: false
      - name: Qualify bounded offline producer and reader
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          QUALIFICATION_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          node --test "$GITHUB_WORKSPACE/qualification-control/tools/stage8-qualification/run.test.mjs"
          node "$GITHUB_WORKSPACE/qualification-control/tools/stage8-qualification/run.mjs" \
            "$GITHUB_WORKSPACE/candidate-repository" "$CANDIDATE_SHA" "$QUALIFICATION_MODE"
      - name: Remove only this run's qualification container
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          container_name="stage8-qualification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if timeout 10s docker container inspect "$container_name" >/dev/null 2>&1; then
            timeout --signal=KILL 15s docker rm -f "$container_name" >/dev/null
          fi

  native-empty-restart:
    if: github.repository == 'enjoyfulwen0204-eng/whoop-briefing' && github.event_name == 'workflow_dispatch' && github.event.repository.private == false && github.ref == 'refs/heads/repair/unattended-20261020' && inputs.mode == 'native-empty-restart' && inputs.candidate_sha == github.sha && github.workflow_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      QUALIFICATION_MODE: ${{ inputs.mode }}
      QUALIFICATION_WORKFLOW_SHA: ${{ github.workflow_sha }}
      QUALIFICATION_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - name: Checkout exact reviewed branch commit without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: enjoyfulwen0204-eng/whoop-briefing
          ref: ${{ inputs.candidate_sha }}
          path: candidate-repository
          persist-credentials: false
          fetch-depth: 1
      - name: Run one bounded native empty-user completion and cold replay
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/candidate-repository/tools/stage8-qualification/native-empty-ci.py" \
            --run "$GITHUB_WORKSPACE/candidate-repository"
      - name: Remove only captured created-container identity if needed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          control="$GITHUB_WORKSPACE/candidate-repository/tools/stage8-qualification/native-empty-ci.py"
          if test -f "$control"; then
            python3 "$control" --cleanup-only
          fi

  one-original-attribution-diagnostic:
    if: github.repository == 'enjoyfulwen0204-eng/whoop-briefing' && github.event_name == 'workflow_dispatch' && github.event.repository.private == false && github.ref == 'refs/heads/diagnostic/native-empty-attribution-20261020' && inputs.mode == 'native-empty-attribution' && inputs.diagnostic_run_intent == 'one-original-empty-120s-v1' && inputs.candidate_sha == github.sha && github.workflow_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      QUALIFICATION_MODE: ${{ inputs.mode }}
      NATIVE_DIAGNOSTIC_RUN_INTENT: ${{ inputs.diagnostic_run_intent }}
      QUALIFICATION_WORKFLOW_SHA: ${{ github.workflow_sha }}
      QUALIFICATION_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - name: Checkout exact reviewed diagnostic commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: enjoyfulwen0204-eng/whoop-briefing
          ref: ${{ inputs.candidate_sha }}
          path: candidate-repository
          persist-credentials: false
          fetch-depth: 0
      - name: One original diagnostic only; no replay or convergence campaign
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/candidate-repository/tools/stage8-qualification/native-empty-diagnostic-ci.py" --run "$GITHUB_WORKSPACE/candidate-repository"
      - name: Remove only an exited captured owned diagnostic container
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          control="$GITHUB_WORKSPACE/candidate-repository/tools/stage8-qualification/native-empty-diagnostic-ci.py"
          if test -f "$control"; then
            python3 "$control" --cleanup-only
          fi


  schema-metadata-repair-verification:
    if: github.repository == 'enjoyfulwen0204-eng/whoop-briefing' && github.event_name == 'workflow_dispatch' && github.event.repository.private == false && github.ref == 'refs/heads/diagnostic/schema-metadata-snapshot-20261020' && inputs.mode == 'native-empty-metadata-repair' && inputs.metadata_repair_run_intent == 'one-original-empty-120s-metadata-repair-v1' && inputs.candidate_sha == github.sha && github.workflow_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      QUALIFICATION_MODE: ${{ inputs.mode }}
      NATIVE_METADATA_REPAIR_RUN_INTENT: ${{ inputs.metadata_repair_run_intent }}
      QUALIFICATION_WORKFLOW_SHA: ${{ github.workflow_sha }}
      QUALIFICATION_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - name: Checkout exact reviewed metadata repair verification commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: enjoyfulwen0204-eng/whoop-briefing
          ref: ${{ inputs.candidate_sha }}
          path: candidate-repository
          persist-credentials: false
          fetch-depth: 0
      - name: One original empty repair verification including all setup; no replay
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/candidate-repository/tools/stage8-qualification/native-empty-metadata-repair-ci.py" --run "$GITHUB_WORKSPACE/candidate-repository"
      - name: Remove only an exited captured owned repair verification container
