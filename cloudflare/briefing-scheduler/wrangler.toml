name = "whoop-briefing-scheduler"
main = "worker.js"
compatibility_date = "2026-09-01"

[triggers]
crons = [] # Coordinated activation: morning cron plus companion-only "10 4-23 * * *".

[vars]
# Reviewed values must match the admitted server configuration before activation.
BRIEFING_EXECUTION_MODE = "OFF"
BRIEFING_COMPANION_ENABLED = "off" # Requires the server flag and each user's stored opt-in.
BRIEFING_CONTINUATION_DISCOVERY = "off" # Enable only with reviewed continuation/server rollout.
BRIEFING_CONTINUATION_SCOPE = "off" # Activation requires stage6-shadow on both Worker and Render.
# Exact approved compatible server commit; non-runnable until review.
BRIEFING_RELEASE_SHA = "REVIEWED_RELEASE_SHA"
BRIEFING_CONFIG_PROOF = "REVIEWED_CONFIG_PROOF"
BRIEFING_ENDPOINT_URL = "https://whoop-telegram-webhook.onrender.com/internal/briefing/run"

[observability]
enabled = true

# The secret value must be added with `wrangler secret put`; never place it here.
