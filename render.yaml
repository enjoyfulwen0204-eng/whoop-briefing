# Render Blueprint
#
# 兩個服務，**兩個都是免費方案**：
#
#   1. web  whoop-privacy          公開靜態 /privacy，不需要憑證或資料庫
#   2. web  whoop-telegram-webhook Telegram 入站 webhook（免費 Web Service）
#
# ⚠️ 這裡**刻意沒有** cron，也**刻意沒有** Background Worker。
#
# 主排程是 Cloudflare Worker Cron（每 10 分鐘），GitHub Actions（每小時第 17 分）
# 是獨立備援；兩者都進入同一支 canonical runner。這個藍圖刻意不宣告 Render
# cron，避免產生第三個排程來源。重疊由 report_claims、resource_locks 與各維護
# 工作的 lease 保護；Render Web Service 只承載受 HMAC 保護的 scheduler endpoint。
#
# ## 入站為什麼是 webhook 不是長輪詢
#
# getUpdates 需要一個永遠活著的 process，在 Render 上那是**付費**的
# Background Worker。webhook 只在有人傳訊息時才需要醒著，所以跑得起免費方案。
#
# 代價：免費 Web Service 閒置一段時間會睡著，睡著之後的第一則訊息要等幾十秒
# 的冷啟動。Telegram 會重送，而耐久去重（telegram_processed_updates +
# telegram_operations）保證重送不會產生第二次副作用。這是刻意接受的取捨。
#
# 正式環境的入站是 webhook；`npm run bot`（長輪詢）只留給本機除錯，
# **任何 Render 服務的 startCommand 都不會啟動它**。
#
# Telegram webhook 與排程器同時活著是安全的（這是刻意的分工）：
#   - WHOOP token refresh 有 Turso lease lock（resource_locks）
#   - 報告發送權有 report_claims，不會重複發送
#   - Telegram ingress 只讀健康資料、只寫 journal；scheduler 才會寫 WHOOP 健康資料
#
# 標成 sync: false 的變數不會寫在檔案裡，要在 Render 網頁的 Environment 分頁自己填。

services:
  # ---------------------------------------------------------------------------
  # Public privacy policy (free static site; no runtime or credentials)
  # ---------------------------------------------------------------------------
  - type: web
    name: whoop-privacy
    runtime: static
    buildCommand: "true"
    staticPublishPath: ./public
    routes:
      - type: rewrite
        source: /privacy
        destination: /privacy.html
    headers:
      - path: /privacy*
        name: Content-Security-Policy
        value: "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'"
      - path: /privacy*
        name: X-Content-Type-Options
        value: nosniff
      - path: /privacy*
        name: Referrer-Policy
        value: no-referrer

  # ---------------------------------------------------------------------------
  # Telegram 入站 webhook（免費 Web Service）
  # ---------------------------------------------------------------------------
  - type: web
    name: whoop-telegram-webhook
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run bot:webhook
    # Render 用這個判斷服務活著。這個端點不碰 DB，也不吐任何內部資訊。
    healthCheckPath: /health
    envVars:
      - key: TIMEZONE
        value: Asia/Taipei
      - key: OPENROUTER_MODEL
        value: anthropic/claude-sonnet-5
      # 這個服務**只要**它真的會用到的東西。
      # 同一個 Web Service 也承載 HMAC 驗證的 /internal/briefing/run。
      # Telegram 入站路由本身仍只讀 Turso、不呼叫 WHOOP；只有 scheduler 路由
      # 會執行 canonical briefing runner 並使用下面的 WHOOP credentials。
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: WHOOP_CLIENT_ID
        sync: false
      - key: WHOOP_CLIENT_SECRET
        sync: false
      - key: BRIEFING_TRIGGER_SECRET
        sync: false
      # V1.2 Phase 3.5：自助上線的 WHOOP OAuth 回呼就掛在這個服務上
      # （GET /whoop/oauth/callback）。這個值必須與 WHOOP Developer
      # Dashboard 註冊的網址**完全一樣**，否則 WHOOP 不會導回來。
      - key: WHOOP_REDIRECT_URI
        sync: false
