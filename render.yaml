# Render Blueprint（可選）
#
# 用法：把這個 repo 連到 Render → New → Blueprint，Render 會自動照這裡建 Cron Job。
# 你也可以完全不用這個檔案，在 Render 網頁上手動建 Cron Job（README 有步驟）。
#
# 排程： */30 * * * *  全天每 30 分鐘跑一次（cron 一律 UTC，但這個排程全天候所以無差別）。
# 為什麼全天跑：daily 的去重 key 是 health_date（主睡眠結束的當地日期），不是執行
# 當下的日期。所以下午才起床、或跨午夜才跑到，都能正確補發且不會重複。
# 「完全沒事做」的那些 run 只查 DB 不打 WHOOP API，很便宜。
# 標成 sync: false 的變數不會寫在檔案裡，要在 Render 網頁的 Environment 分頁自己填。

services:
  - type: cron
    name: whoop-briefing
    runtime: node
    plan: starter
    schedule: "*/30 * * * *"
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: TIMEZONE
        value: Asia/Taipei
      - key: OPENROUTER_MODEL
        value: anthropic/claude-sonnet-5
      - key: WHOOP_CLIENT_ID
        sync: false
      - key: WHOOP_CLIENT_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
